name: Bump Version and Tag Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semantic version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Version to use when custom is selected (for example 2.0.1)"
        required: false
        default: ""
        type: string

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  bump-and-tag:
    name: Bump, validate, commit, and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and changelog
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          python scripts/bump-version.py \
            --type "$BUMP_TYPE" \
            --custom "$CUSTOM_VERSION"
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Update lockfile
        run: uv lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Run linter
        run: uv run ruff check src tests scripts

      - name: Run type checker
        run: uv run mypy src

      - name: Build package
        run: uv build

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

      - name: Commit version bump and push tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "LuiccianDev"
          git config user.email "181299053+LuiccianDev@users.noreply.github.com"
          git add pyproject.toml manifest.json CHANGELOG.md docs/TOOLS.md uv.lock
          git commit -m "chore(release): bump version to $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "HEAD:$DEFAULT_BRANCH" "$TAG"
