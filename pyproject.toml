[project]
name = "office-mcp"
version = "2.0.0"
description = "High-performance Model Context Protocol (MCP) server for Word (.docx) document generation and manipulation"
readme = "README.md"
authors = [
    {name = "LuiccianDev"}
]
license = {text = "MIT"}
keywords = ["mcp", "model-context-protocol", "office", "word", "docx", "llm", "automation"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "docx2pdf>=0.1.8",
    "fastmcp>=3.0.0",
    "msoffcrypto-tool>=5.4.2",
    "python-docx>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/LuiccianDev/mcp_word_office"
Repository = "https://github.com/LuiccianDev/mcp_word_office"
Documentation = "https://github.com/LuiccianDev/mcp_word_office/blob/master/README.md"
Issues = "https://github.com/LuiccianDev/mcp_word_office/issues"
Changelog = "https://github.com/LuiccianDev/mcp_word_office/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pillow>=11.3.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.5",
]

[project.scripts]
office-mcp = "office_mcp.__main__:main"
office_mcp = "office_mcp.__main__:main"
mcp-word = "office_mcp.__main__:main"

[project.entry-points."mcp.servers"]
office-mcp = "office_mcp.__main__:main"
office_mcp = "office_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/office_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Tool Configurations (PEP 518 / PEP 621)
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit
]
ignore = [
    "W291",  # trailing whitespace
    "E501",  # line too long, handled by black/formatter
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert detected (pytest uses assert)
    "S110",  # raise exception in __init__
    "S112",  # use of assert (pytest)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["office_mcp"]
combine-as-imports = true
order-by-type = true
case-sensitive = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "\\.venv/"]
files = ["src"]
