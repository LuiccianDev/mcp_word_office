[project]
name = "luiccian-word-mcp"
version = "2.0.0"
description = "High-performance Model Context Protocol (MCP) server for Word (.docx) document generation and manipulation"
readme = "README.md"
authors = [
    {name = "LuiccianDev"}
]
license = {text = "MIT"}
keywords = ["mcp", "model-context-protocol", "office", "word", "docx", "llm", "automation"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "docx2pdf>=0.1.8",
    "fastmcp>=3.0.0",
    "msoffcrypto-tool>=5.4.2",
    "python-docx>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/LuiccianDev/word-mcp"
Repository = "https://github.com/LuiccianDev/word-mcp"
Documentation = "https://github.com/LuiccianDev/word-mcp/blob/master/README.md"
Issues = "https://github.com/LuiccianDev/word-mcp/issues"
Changelog = "https://github.com/LuiccianDev/word-mcp/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pillow>=11.3.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.5",
]

[project.scripts]
word-mcp = "word_mcp.__main__:main"
word_mcp = "word_mcp.__main__:main"
mcp-word = "word_mcp.__main__:main"

[project.entry-points."mcp.servers"]
word-mcp = "word_mcp.__main__:main"
word_mcp = "word_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/word_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Tool Configurations (PEP 518 / PEP 621)
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "W291",  # trailing whitespace
    "E501",  # line too long, handled by black/formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E", "W", "F"]

[tool.ruff.lint.isort]
known-first-party = ["word_mcp"]
combine-as-imports = true
order-by-type = true
case-sensitive = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "\\.venv/"]
files = ["src"]
